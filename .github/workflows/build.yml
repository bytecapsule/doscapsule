name: build

# The single pipeline for this project.
#
# It always BUILDS: frontend, Go tests, and macOS (arm64 + x64) plus Windows
# (x64) binaries, packaged as three zips and uploaded as artifacts.
#
# Tick `release` when dispatching and it also PUBLISHES those zips as a
# timestamped GitHub Release. Left unticked it stops after the artifacts, which
# is the "just give me a build" path.
#
# Local verification lives in the Makefile (make test / make zip-all), so this
# workflow does not need to run on every push or pull request.
#
# Zips are FLAT (binary at the archive root) so Homebrew's `bin.install` and
# Scoop's `bin` resolve without a wrapper directory.
#
# DOSBox is NOT bundled: Formula/doscapsule.rb and bucket/doscapsule.json both
# declare dosbox-staging as a hard dependency, so a package-manager install
# pulls it in automatically.
#
# Version format: <UTC date>-<serial>, e.g. 20261122-1.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release"
        required: true
        default: true
        type: boolean
  # Alternate trigger for automation: needs only `contents: write`, whereas
  # workflow_dispatch needs the `Actions` scope on a fine-grained token.
  #   curl -X POST -H "Authorization: Bearer $TOKEN" \
  #     https://api.github.com/repos/bytecapsule/doscapsule/dispatches \
  #     -d '{"event_type":"build-release","client_payload":{"release":"true"}}'
  repository_dispatch:
    types: [build-release]

# Least privilege by default: build jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One version for the whole run: every platform's zip name and the Release
  # tag must agree, so this must not be computed per matrix leg.
  #
  # Format is <UTC date>-<serial>, e.g. 20261122-1. The serial is derived from
  # the releases that already exist for that date, so publishing twice on the
  # same day yields -1 and -2 instead of colliding.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute version (date + serial)
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y%m%d)"
          # Highest serial already used today (0 when this is the first).
          LAST="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                    --json tagName --jq '.[].tagName' 2>/dev/null \
                  | grep -E "^${DATE}-[0-9]+$" | sed "s/^${DATE}-//" \
                  | sort -n | tail -1 || true)"
          NEXT=$(( ${LAST:-0} + 1 ))
          echo "tag=${DATE}-${NEXT}" >> "$GITHUB_OUTPUT"
          echo "version: ${DATE}-${NEXT}"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            label: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            label: x64
            ext: ""
          - goos: windows
            goarch: amd64
            label: windows-x64
            ext: ".exe"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs so a re-pointed tag cannot inject
      # code. Bump deliberately; never switch back to floating tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Run tests
        run: go test ./...

      - name: Build binary (${{ matrix.label }})
        working-directory: cmd/doscapsule
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "../../doscapsule-${{ matrix.label }}${{ matrix.ext }}" .

      - name: Package zip (${{ matrix.label }})
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          bash scripts/zip.sh \
            "doscapsule-${{ matrix.label }}${{ matrix.ext }}" \
            "${{ matrix.label }}" \
            "${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doscapsule-${{ matrix.label }}
          path: doscapsule-${{ matrix.label }}-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [version, build]
    if: ${{ github.event_name == 'repository_dispatch' || github.event.inputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create a Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -la dist

      - name: Publish Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: DOS Capsule ${{ needs.version.outputs.tag }}
          body: |
            Automated build of DOS Capsule — version `${{ needs.version.outputs.tag }}`.

            | Platform | File |
            |---|---|
            | macOS Apple Silicon | `doscapsule-arm64-${{ needs.version.outputs.tag }}.zip` |
            | macOS Intel | `doscapsule-x64-${{ needs.version.outputs.tag }}.zip` |
            | Windows x64 | `doscapsule-windows-x64-${{ needs.version.outputs.tag }}.zip` |

            DOSBox is **not** bundled. Install it first:
            - macOS: `brew install dosbox-staging`
            - Windows: `scoop install dosbox-staging`

            Or install the app with its DOSBox dependency in one step:
            - macOS: `brew tap bytecapsule/doscapsule && brew install doscapsule`
            - Windows: `scoop bucket add bytecapsule https://github.com/bytecapsule/doscapsule` then `scoop install doscapsule`
          files: dist/doscapsule-*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
