name: ci

# Verification only: builds the frontend and runs the Go tests.
#
# NOTE (early phase): this is MANUAL only on purpose. While the codebase
# changes daily, an automatic trigger on every push/PR would queue a lot of
# builds for no benefit. When the project settles, enable the commented
# pushes block below so every change on main is verified.
#
# Pull requests deliberately do NOT trigger this workflow right now: PRs come
# mostly from Dependabot and would only add noise. A reviewer can run this
# workflow by hand against a branch when a PR actually needs checking.

on:
  workflow_dispatch:
  # Uncomment to verify every change landing on main:
  # push:
  #   branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend build
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Build three targets (smoke test)
        working-directory: cmd/doscapsule
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=darwin  GOARCH=arm64 go build -trimpath -o /tmp/dc-darwin-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -o /tmp/dc-darwin-amd64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/dc-windows.exe .
