name: ci

# Runs on every push/PR. Read-only, no secrets, no artefacts published:
# this is the gate that lets outside contributions be evaluated safely.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend build
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Build (arm64)
        working-directory: cmd/doscapsule
        run: GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/doscapsule-ci .
