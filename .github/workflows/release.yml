name: build-release

# Builds DOS Capsule for macOS (arm64 + x64) and Windows (x64) on Linux
# runners - Go cross-compiles, and nothing here needs cgo or code signing, so
# macOS runners are unnecessary.
#
# Zips are FLAT (binary at the archive root) so Homebrew's `bin.install` and
# Scoop's `bin` resolve without a wrapper directory.
#
# DOSBox is NOT bundled: the Homebrew formula and the Scoop manifest declare
# dosbox-staging as a hard dependency, so a package-manager install pulls it
# in automatically.
#
# Trigger: manual only (workflow_dispatch). `release` selects whether a
# Release is published (default) or only build artifacts are uploaded.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release"
        required: true
        default: true
        type: boolean

# Least privilege by default: build jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One timestamp for the whole run: every platform's zip name and the Release
  # tag must agree, so this must not be computed per matrix leg.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute version (UTC timestamp)
        id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            label: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            label: x64
            ext: ""
          - goos: windows
            goarch: amd64
            label: windows-x64
            ext: ".exe"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs so a re-pointed tag cannot inject
      # code. Bump deliberately; never switch back to floating tags.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Run tests
        run: go test ./...

      - name: Build binary (${{ matrix.label }})
        working-directory: cmd/doscapsule
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "../../doscapsule-${{ matrix.label }}${{ matrix.ext }}" .

      - name: Package zip (${{ matrix.label }})
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          bash scripts/zip.sh \
            "doscapsule-${{ matrix.label }}${{ matrix.ext }}" \
            "${{ matrix.label }}" \
            "${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doscapsule-${{ matrix.label }}
          path: doscapsule-${{ matrix.label }}-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [version, build]
    if: ${{ github.event.inputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create a Release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -la dist

      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: DOS Capsule ${{ needs.version.outputs.tag }}
          body: |
            Automated build of DOS Capsule — version `${{ needs.version.outputs.tag }}`.

            | Platform | File |
            |---|---|
            | macOS Apple Silicon | `doscapsule-arm64-${{ needs.version.outputs.tag }}.zip` |
            | macOS Intel | `doscapsule-x64-${{ needs.version.outputs.tag }}.zip` |
            | Windows x64 | `doscapsule-windows-x64-${{ needs.version.outputs.tag }}.zip` |

            DOSBox is **not** bundled. Install it first:
            - macOS: `brew install dosbox-staging`
            - Windows: `scoop install dosbox-staging`

            Or install the app with its DOSBox dependency in one step:
            - macOS: `brew install bytecapsule/tap/doscapsule`
            - Windows: `scoop bucket add bytecapsule https://github.com/bytecapsule/scoop-bucket` then `scoop install doscapsule`
          files: dist/doscapsule-*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
